  prompt:
    input: how do i run this application
    output: |
      Here's how to run the application:

      Quick Start

      # 1. Make sure you have an .env file with your API key
      echo "ANTHROPIC_API_KEY=your_key_here" > .env

      # 2. Install dependencies (if not already done)
      uv sync

      # 3. Run the application
      ./run.sh

      The app will start at http://localhost:8000

      Prerequisites

      If you don't have uv installed:
      curl -LsSf https://astral.sh/uv/install.sh | sh

      If you need an Anthropic API key:
      - Sign up at https://console.anthropic.com/
      - Create an API key
      - Add it to your .env file

      Alternative: Manual Start

      cd backend
      uv run uvicorn app:app --reload --port 8000

      What Happens on Startup

      1. Creates ./chroma_db directory for vector storage
      2. Loads course documents from ./docs folder
      3. Processes and embeds documents into ChromaDB
      4. Starts FastAPI server on port 8000
      5. Serves frontend at root URL

      Access Points

      - Web Interface: http://localhost:8000
      - API Documentation: http://localhost:8000/docs
      - API Endpoints:
        - POST /api/query - Ask questions
        - GET /api/courses - Get course stats

      Troubleshooting

      Port already in use?
      # Kill existing process on port 8000
      lsof -ti:8000 | xargs kill -9

      Missing API key error?
      - Check .env file exists in root directory
      - Verify key format: ANTHROPIC_API_KEY=sk-ant-...

      Windows users: Use Git Bash to run the shell script.

